oracles:
  - id: tab5.5-restored-guard
    type: internal-guard
    path: tests/test_table55_restored.py
    tests:
      - tests/test_table55_restored.py::test_restored_rows_are_declared
      - tests/test_table55_restored.py::test_exact_restored_row_refuses
      - tests/test_table55_restored.py::test_interpolation_touching_restored_row_refuses
      - tests/test_table55_restored.py::test_verified_rows_still_work
      - tests/test_table55_restored.py::test_sensitivity_mode_is_explicit
      - tests/test_table55_restored.py::test_bearing_resistance_refuses_on_damaged_cell
      - tests/test_table55_restored.py::test_default_design_case_is_unaffected
    tolerance: n/a (guard, not comparison)
    status: verified
    note: ячейки Mγ(38) и Mγ(43) не подтверждены печатным оригиналом; любое их использование обязано давать «не определено»
  - id: b1-slope-pyslope
    type: cross-tool
    path: calc/b1_slope.py
    tests:
      - tests/test_b1_slope.py::test_fellenius_on_pyslope_critical_circle
      - tests/test_b1_slope.py::test_pyslope_agreement_within_declared_tolerance
      - tests/test_b1_slope.py::test_monotonic_fs_in_cohesion
      - tests/test_b1_slope.py::test_bishop_on_pyslope_critical_circle
    tolerance: ±5% (Fellenius vs pyslope on the same circle) — passed (2.2%)
    status: verified
  - id: b3-axial-hand-ref
    type: manual-reference
    path: tests/test_b3_axial.py
    tests:
      - tests/test_b3_axial.py::test_hand_matches_openpile_node_values
      - tests/test_b3_axial.py::test_tip_pressure_reference
    tolerance: 0.0% (z<=20m); fmax cap near tip
    status: verified
  - id: manual-d1
    type: manual
    path: docs/manual-check-d1.md
    status: verified
  - id: commercial-core
    type: external
    tolerance: ±5% (R and settlement)
    status: cancelled
    note: "Cancelled by owner decision 2026-10-29 (no licensed access planned). Replacement
      oracles: manual closed-form check (docs/manual-check-d1.md, verified), independent second
      implementation (calc_check), cross-tool comparisons (pyslope/openpile vs hand formulas),
      published free cases if found. See docs/benchmarks/README.md." 
